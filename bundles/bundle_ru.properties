# Campaign Sectors
sector.exoprosopa-19s-01-newgrounds.name = Начало
sector.exoprosopa-19s-01-newgrounds.description = Материнский корабль отправил вас сюда в качестве первой миссии.\n\nИзучите доступные ресурсы и возведите инфраструктуру.

sector.exoprosopa-19s-02-mountain-ridge.name = Горный хребет
sector.exoprosopa-19s-02-mountain-ridge.description = Единственный доступный путь из [accent]Начала[].\n\nЭтот сектор богат [#90bdd8]тантрием[] и антрацитом.\nИзучите [accent]Очиститель элексира[] и [accent]Генератор горения[] для противодействия врагу.

sector.exoprosopa-19s-03-hostile-outpost.name = Лагерь
sector.exoprosopa-19s-03-hostile-outpost.description = Этот сектор беден на [#647cc2]кобальтовые[] и антрацитовые залежи в стенах.\nПотребуются[accent]Реактивные буры[] для добычи руд из под земли.\n\nПротивник возвёл тут небольшой лагерь с сильной защитой.\n[accent]Мехи[] и [accent]Шатуны[] необходимы для увеличения вашей огневой мощи.

sector.exoprosopa-19s-04-cliffside.name = Скала
sector.exoprosopa-19s-04-cliffside.description = Данный сектор содержит запасы [#9d7f7f]хрома[].\nИспользуйте [accent]Реактивные буры[] для добычи.\n\nПротивник отправит элитных юнитов для защиты этого сектора.

sector.exoprosopa-19s-05-crest.name = Пик
sector.exoprosopa-19s-05-crest.description = Этот сектор очень тесен и бездорожен.\nТолько [accent]Мехи[] смогут пройти здесь.\n\nСоздайте их как можно больше.\nЗахватите этот сектор.

sector.exoprosopa-19s-06-botanical-garden.name = Ботанический сад
sector.exoprosopa-19s-06-botanical-garden.description = В этом секторе находятся большие запасы [#9d7f7f]хрома[] на другой части острова.\nПрекрасное место для тестирования новой транспортной технологии.\n\nИзучите [accent]Ударный ускоритель[] и [accent]Камеру модернизации кораблей[] для захвата вражеского аванпоста неподалёку.

sector.exoprosopa-19s-07-escarpment.name = Склон
sector.exoprosopa-19s-07-escarpment.description = Важный транспортный узел, соединяющий аванпосты Родес.\nВ виду малого количества [#90bdd8]тантрия[] в этой области, изучите [accent]Тантроформер[], что бы создать [#90bdd8]тантрий[] самому.\n\nРодес не будут добры к вам, и постараются как можно быстрее уничтожить вас.

sector.exoprosopa-19s-08-cornerstone.name = Краеугольный камень
sector.exoprosopa-19s-08-cornerstone.description = Вы приземляетесь на сектор с горным ландшафтом. Вражеская база скрыта за местностью.\nЕдиницы второго уровня могут стать необходимы для захвата.\n\nИзучите [accent]Камеру модернизации танков[] и [accent]Камеру модернизации шатунов[].

sector.exoprosopa-19s-09-hazardous-wasteland.name = Угрожающая пустошь
sector.exoprosopa-19s-09-hazardous-wasteland.description = Будучи богатой [#b979bd]миазмой[], но бедной на антрацит, этот сектор крайне опасен.\nПостройте [accent]Геотермальный генератор[] для выработки энергии.\n\nПротивник возвёл здесь мощную базу с продвинутыми технологиями.\nЗахватите сектор и изучите технологии.

sector.exoprosopa-19s-10-precipice.name = Пропасть
sector.exoprosopa-19s-10-precipice.description = Неровный, искревлённый каньон, использующийся Родес в основном как [accent]Полигон тестирования мехов[].\nНеподготовленная земля затрудняет строительство базы.\n\nИспользуйте [accent]Ударные катапульты[] для перемещения ресурсов по воздуху.\nПодготовьтесь к атакам с разных сторон.
    
sector.exoprosopa-19s-11-creek.name = Бухта
sector.exoprosopa-19s-11-creek.description = Равнина, покрытая цветущим [#53a999]гидритом[] и богатая [#72ccbd]аквамариновыми[] залежами.\nИсследуйте [accent]Аквамариновый фильтр[] и [accent]Элементальный разделитель[], для альтернативного производства базовых материалов.\n\nНаши радары засекли активность Родес. Не дайте им времени прислать сильнейших юнитов.

sector.exoprosopa-19s-12-marshlands.name = Болота
sector.exoprosopa-19s-12-marshlands.description = Данный сектор огромен и полон ресурсами, но будет атакован сразу по приземлению.\n\nИспользуйте [#51c59c]морфит[] для дальнейшей колонизации.\nРодес отправят сильных единиц, дабы остановить ваше завоевание.

# sector.exoprosopa-19s-13-antarstar.name = 
# sector.exoprosopa-19s-13-antarstar.description = 

sector.exoprosopa-19s-14-pier.name = Пирс
sector.exoprosopa-19s-14-pier.description = Этот сектор давно использовался [accent]Гова Индастрис[], но был захвачен Родес из за вечных войн.\nПирс с его производством стали заброшенными и забытыми.\n\n[#4fab92]Астральные[] морские единицы появились на радаре. Они могут быть сильнее обычных[].\n\n[scarlet]Зафиксирован НЛО[].\n\nИспользуйте [#51c59c]Морфитовую плазму[] для создания более мощной обороны. Используйте лучшую тактику против них.

sector.exoprosopa-19s-15-bioproject-core.name = Ядро Биоисследования
sector.exoprosopa-19s-15-bioproject-core.description = Заброшенное исследовательское предприятие, токсичное и не обитаемое.\nСкважины расположены на отдалении друг от друга, исследуйте оставшиеся технологии для выживания.\n\nИспользуйте [accent]Центр фильтрации миазмы[] как альтернативное решение. Так же, изучите [accent]Грузовое депо[] для транспортировки дронами.\n\n[salmon]Зона посадки нестабильна, дополнительные структуры запрещены[].

# sector.exoprosopa-19s-16-polar-station.name = 
# sector.exoprosopa-19s-16-polar-station.description = 

# sector.exoprosopa-19s-17-tundra-peaks.name = 
# sector.exoprosopa-19s-17-tundra-peaks.description = 

sector.exoprosopa-19s-23-eridanus.name = Эрида
sector.exoprosopa-19s-23-eridanus.description = Зигзагообразный ландшафт заставит противника долго добираться до вашей базы.\nНе будьте одурачены большими паузами между волн, Родес будут отправлять своих юнитов быстрее по мере вашего прогресса.\n\nИсследуйте [#bf97d6]гравитикс[]. Избавьтесь от врагов.\n\n\n[cyan]WIP

# Optional Sectors
sector.exoprosopa-20t-01-luminary.name = Luminary
sector.exoprosopa-20t-01-luminary.description = Due to lack of vents, you will need a better source of power.\nIt might be a good idea to have air defence around the edges.\n\n\n[accent]Note: This is an optional sector. Capturing it is not required for completing the campaign.

sector.exoprosopa-20t-02-foggy-fields.name = Foggy Fields
sector.exoprosopa-20t-02-foggy-fields.description = Due to a great number of vents present, the sector has occasional foggy episodes.\nThe enemy has built a giant base here. It is recommended to bring large amounts firepower.\n\n\n[accent]Note: This is an optional sector. Capturing it is not required for completing the campaign.

sector.exoprosopa-20t-03-reservoir.name = Abandoned Reservoir
sector.exoprosopa-20t-03-reservoir.description = You land in a cramped sector filled with [#b979bd]miasma[].\nThe sensor detects an enemy base in this sector.\n\nUnfortunately, you must build your production and defence between a lake and distorted environment.\nUse ship units to dismantle the enemy base before the enemy dismantles you.\n\n\n[accent]Note: This is an optional sector. Capturing it is not required for completing the campaign.

sector.exoprosopa-20t-04-trekker-campsite.name = Trekker Campsite
sector.exoprosopa-20t-04-trekker-campsite.description = This is the campsite of the mountain trekker, controlled by Rhodes.\nUse various units to eliminate all enemy cores.\n\n[red]Intel suggests the enemy has nuclear weapons of some form, stay alert for a potential strike!\n\n\n[accent]Note: This is an optional sector. Capturing it is not required for completing the campaign.

sector.exoprosopa-20t-11-ridgeline.name = Ridgeline
sector.exoprosopa-20t-11-ridgeline.description = Rhodes have built a heavily guarded stronghold here. It remains undefeated for years.\nYour goal is to find any exploit and all weaknesses in order to make it fall.\n\n\n[cyan]Modifiers:\n- Terraformic Basin, Terrafilter & Nichrome Dissembler are unavailable.\n\n\n[accent]Note: This is an optional sector. Capturing it is not required for completing the campaign.

sector.exoprosopa-20t-26-clover-springs.name = Clover Springs
sector.exoprosopa-20t-26-clover-springs.description = Hotspring occupied by the [accent]Rhodes Facility[].\nThe lakes generates at the central area, creating almost perfect four clover leafes with several twists.\n\nYou will land on a pre-built base from another agent.\nAdvance to the crater and eliminate all enemy cores.\n\n\n[cyan]WIP\n\n\n[accent]Note: This is an optional sector. Capturing it is not required for completing the campaign.

sector.exoprosopa-20t-37-myrra-heights.name = Myrra Heights
sector.exoprosopa-20t-37-myrra-heights.description = The highest mountain range in frostnova. A home to the Rhodes mightiest operation known.\nThe enemy have been constructing an experimental [#BF97D6]gravitix[] warhead.\n\n[scarlet]BEWARE OF POTENTIAL STRIKE[].\n\nWe will attempt to sent units to aid your endevors of conquest, by contacting [accent]Signal Transmission Station[].\nThe enemy values this sector with all of their might. So expect large amounts of resistance and strife in a myriad of ways.\n\n[cyan]WIP\n\n\n[accent]Note: This is an optional sector. Capturing it is not required for completing the campaign.

sector.exoprosopa-20t-99-ending.name = Ending
sector.exoprosopa-20t-99-ending.description = Are we reaching [gray]The..  End.. ??

# Resources - Items
block.exoprosopa-tech-ore.name = Technoscrap Wall
block.exoprosopa-bethinecobalt.name = Cobalt Wall
block.exoprosopa-flower-unique.name = Petal Flower
block.exoprosopa-flower-small.name = Small Flower
block.exoprosopa-flower-large.name = Large Flower

item.exoprosopa-01a-01-item-cobalt.name = Cobalt
item.exoprosopa-01a-01-item-cobalt.description = Used in basic construction and as ammunition.

item.exoprosopa-01a-02-item-nickel.name = Nickel
item.exoprosopa-01a-02-item-nickel.description = Used in basic electronics and factories.

item.exoprosopa-01a-03-item-anthracite.name = Anthracite
item.exoprosopa-01a-03-item-anthracite.description = Used in generators for burning and heating.

item.exoprosopa-01a-03-item-aquashard.name = Aquamarine
item.exoprosopa-01a-03-item-aquashard.description = Aquatic material, similar to [#90bdd8]tantrium[].

item.exoprosopa-01a-03-item-lamine.name = Lamine
item.exoprosopa-01a-03-item-lamine.description = High-explosive material, used in heat-related blocks and explosive ammo.

item.exoprosopa-01a-04-item-tantra-sand.name = Tantrium
item.exoprosopa-01a-04-item-tantra-sand.description = Mostly used to purifying [#d488ea]elixir[], has some other uses.

item.exoprosopa-01a-05-item-aluminium.name = Aluminium
item.exoprosopa-01a-05-item-aluminium.description = Mainly used in units and electronic parts.

item.exoprosopa-01a-05-item-raw-nichrome.name = Nichrome
item.exoprosopa-01a-05-item-raw-nichrome.description = Fused [#e1cf9a]nickel[] and [#9d7f7f]chromium[], known as [#a88b65]nichrome[]. Can be separated using elemental separators.

item.exoprosopa-01a-06-item-chromium.name = Chromium
item.exoprosopa-01a-06-item-chromium.description = Tough and strong material used in many buildings and ammunition.

item.exoprosopa-01a-07-item-clevorite.name = Clevorite
item.exoprosopa-01a-07-item-clevorite.description = Super conductive material that is used in many advanced buildings.

item.exoprosopa-01a-08-item-petal.name = Bloodstone
item.exoprosopa-01a-08-item-petal.description = High durability material used in advanced unit assembly and gravity manipulation.

item.exoprosopa-01a-08-item-petal-flower.name = Petal Fragment
item.exoprosopa-01a-08-item-petal-flower.description = Extracted flower petal, can be processed with [#ffd5e2]nucridscrap[] to produce [#ff91b3]bloodstone[].

item.exoprosopa-01a-08-item-nucrid.name = Nucridscrap
item.exoprosopa-01a-08-item-nucrid.description = Strong material originating from [#ffd5e2]nucrid[] walls, can be strengthend more with [#ff89af]petal fragments[].

item.exoprosopa-01a-09-item-morphite.name = Morphite
item.exoprosopa-01a-09-item-morphite.description = Crystallic, high energy material from highly accelerated low-tier material. Used in electric-based component blocks and weaponry.

item.exoprosopa-01a-10-item-bethine.name = Gravitix
item.exoprosopa-01a-10-item-bethine.description = Strong material used in gravity manipulation based technology and advanced component parts.

item.exoprosopa-01a-11-item-pyroxene.name = Pyroxenes
item.exoprosopa-01a-11-item-pyroxene.description = High-tech material used in self-healing components.

item.exoprosopa-01a-11-item-technoscrap.name = Technoscrap
item.exoprosopa-01a-11-item-technoscrap.description = Bunch of metal scraps, needs filtering before it is usable.

item.exoprosopa-01a-12-item-techno-plating.name = Techno Plating
item.exoprosopa-01a-12-item-techno-plating.description = Stores decent amount of information and data, used in logic-related blocks.

item.exoprosopa-01a-21-item-gryphic.name = Gryphic
item.exoprosopa-01a-21-item-gryphic.description = Refined [#647cc2]cobalt[], more durable thanks to the added [#60c9ad]necroplasm[].
item.exoprosopa-01a-21-item-gryphic.detail = [cyan]Astral exclusive item.

item.exoprosopa-01a-22-item-crystallic-geode.name = Crystallic Geode
item.exoprosopa-01a-22-item-crystallic-geode.description = Crystalline morphite, it is unknown how they form.
item.exoprosopa-01a-22-item-crystallic-geode.details = Its spiky and electric!

item.exoprosopa-01a-31-item-morphitix-crystal.name = Morphitix Crystal
item.exoprosopa-01a-31-item-morphitix-crystal.description = Another morphite form, uses accelerated crystal instead of normal material.

# Resources - Liquid
liquid.exoprosopa-02b-01-bioliquid.name = Elixir
liquid.exoprosopa-02b-01-bioliquid.description = Contaminated water mixed with biomass, can be filtered for coolant or used in factories.

liquid.exoprosopa-02b-02-a-purified-elixir.name = Cryogenics
liquid.exoprosopa-02b-02-a-purified-elixir.description = Filtered [#d488ea]elixir[], able to operate advanced factories. Can be used as turret coolant.

liquid.exoprosopa-02b-02-ichor.name = Ichor
liquid.exoprosopa-02b-02-ichor.description = Truly purified fluids, self-healing technology and stable regeneration.

liquid.exoprosopa-02b-03-necroplasm.name = Necroplasm
liquid.exoprosopa-02b-03-necroplasm.description = Biological mutated liquids, grows slowly until it gained its intelligence mutation.

liquid.exoprosopa-02b-04-miasma.name = Miasma
liquid.exoprosopa-02b-04-miasma.description = Uncontrollable mass of sulfuric acid, can spread into [#d488ea]elixir[].

liquid.exoprosopa-02b-05-hydrowater.name = Hydryite
liquid.exoprosopa-02b-05-hydrowater.description = Used in cleaning [#72ccbd]aquamarine[], an [#d488ea]elixir[] counterpart.

liquid.exoprosopa-02b-06-morphitix-plasma.name = Morphitix Plasma
liquid.exoprosopa-02b-06-morphitix-plasma.description = Plasma created by heating and discharging [#51c59c]morphite[].

liquid.exoprosopa-02b-07-ectoplasm.name = Ectoplasm
liquid.exoprosopa-02b-07-ectoplasm.description = A deadly liquid created from [#b979bd]miasma[], highly explosive. Can spread into [#d488ea]elixir[].

liquid.exoprosopa-02b-08-nucliogen.name = Nucliogen
liquid.exoprosopa-02b-08-nucliogen.description = Slimy substance, byproduct from surrounding petal flower.

# Distribution Blocks
block.exoprosopa-05e-01-transport-pipe.name = Transport Pipe
block.exoprosopa-05e-01-transport-pipe.description = Moves items forward. Only capable of storing a single item.

block.exoprosopa-05e-02-a-aluminium-pipe.name = Aluminium Pipe
block.exoprosopa-05e-02-a-aluminium-pipe.description = Moves items forward. Only capable of storing a single item, does not accept non-pipe inputs from the sides.

block.exoprosopa-05e-02-chromium-pipe.name = Chromium Pipe
block.exoprosopa-05e-02-chromium-pipe.description = Moves items forward. Faster than standard pipe. Only capable of storing a single item.

block.exoprosopa-05e-03-armored-pipe.name = Bloodstone Pipe
block.exoprosopa-05e-03-armored-pipe.description = Moves items forward, does not accept non-pipes inputs from the sides. Decently armored.

block.exoprosopa-05e-03-morphite-conveyor.name = Morphite Belt
block.exoprosopa-05e-03-morphite-conveyor.description = Packages stacks of items before sending them off, faster when powered.

block.exoprosopa-05e-04-a-morphite-router.name = Morphite Splitter
block.exoprosopa-05e-04-a-morphite-router.description = Distributes the stacks equally over every output. Faster when powered.

block.exoprosopa-05e-05-crossblock.name = Junction Pipe
block.exoprosopa-05e-05-crossblock.description = Allows for two pipelines to cross each other.

block.exoprosopa-05e-06-splitter.name = Splitter Pipe
block.exoprosopa-05e-06-splitter.description = Distributes input items to 3 output directions equally.

block.exoprosopa-05e-07-mechanical-bridge.name = Bridge Pipe
block.exoprosopa-05e-07-mechanical-bridge.description = Transports items over terrain or buildings.

block.exoprosopa-05e-08-pipeline-sorter.name = Sorter Pipe
block.exoprosopa-05e-08-pipeline-sorter.description = Can be used as a directional router and sorter.

block.exoprosopa-05e-10-pipeline-overflow.name = Overflow Gate Pipe
block.exoprosopa-05e-10-pipeline-overflow.description = Only outputs items to the sides if the front path is blocked.

block.exoprosopa-05e-10-pipeline-underflow.name = Underflow Gate Pipe
block.exoprosopa-05e-10-pipeline-underflow.description = Only outputs items to the front if the sides path is blocked.

block.exoprosopa-05e-11-morph-bridge.name = Morph Bridge
block.exoprosopa-05e-11-morph-bridge.description = Transport items very fast over blocks and buildings, requires power.

block.exoprosopa-05e-13-a-surge-driver.name = Surge Driver
block.exoprosopa-05e-13-a-surge-driver.description = Transports items in batches to another surge driver in range.

block.exoprosopa-05e-13-cargobay.name = Cargo Bay
block.exoprosopa-05e-13-cargobay.description = Loads a cargo drone with items to be sent off towards a cargo depot.

block.exoprosopa-05e-14-cargodepot.name = Cargo Depot
block.exoprosopa-05e-14-cargodepot.description = Accepts items dropped off by an iris cargo drone.

block.exoprosopa-05e-15-pipeline-unloader.name = Unloader Pipeline
block.exoprosopa-05e-15-pipeline-unloader.description = A directional unloader, cannot unload contents directly from cores.

# Drills Blocks
block.exoprosopa-04d-01-pressure-generator.name = Pressure Generator
block.exoprosopa-04d-01-pressure-generator.description = Generates power using pressure from vents.

block.exoprosopa-04d-02-elixir-collector.name = Elixir Collector
block.exoprosopa-04d-02-elixir-collector.description = Extracts [#d488ea]elixir[] from vents, requires power to operate.

block.exoprosopa-04d-02-elixir-extractor.name = Elixir Extractor
block.exoprosopa-04d-02-elixir-extractor.description = A better [#d488ea]elixir[] extractor, requires power to operate.

block.exoprosopa-04d-03-ore-extractor.name = Ore Extractor
block.exoprosopa-04d-03-ore-extractor.description = Extracts ore in its direction, requires [#d488ea]elixir[] and power to operate.

block.exoprosopa-04d-03-r-ore-blaster.name = Ore Blaster
block.exoprosopa-04d-03-r-ore-blaster.description = A better ore extractor, requires [#76c9e5]cryogenics[] to function.

block.exoprosopa-04d-04-a-wall-extractor.name = Tantrium Crusher
block.exoprosopa-04d-04-a-wall-extractor.description = Extracts [#90bdd8]tantrium[] from tantrium walls.

block.exoprosopa-04d-04-a-wall-shifter.name = Tantrium Extractinator
block.exoprosopa-04d-04-a-wall-shifter.description = Extracts [#90bdd8]tantrium[] from tantrium walls, faster than a tantrium crusher.

block.exoprosopa-04d-04-b-aqua-dregder.name = Aquamarine Crusher
block.exoprosopa-04d-04-b-aqua-dregder.description = Crushes down aqua walls to extract [#72ccbd]aquamarine[].

block.exoprosopa-04d-04-b-aqua-extractor.name = Aquamarine Extractor
block.exoprosopa-04d-04-b-aqua-extractor.description = Slowly extracts [#72ccbd]aquamarine[] from aqua tiles, requires [#53a999]hydryite[] to operate.

block.exoprosopa-04d-04-bore-jet.name = Bore Jet
block.exoprosopa-04d-04-bore-jet.description = Uses a high-pressure jet of [#d488ea]elixir[] to mine ground ores.

block.exoprosopa-04d-05-ichor-rig.name = Ichor Rig
block.exoprosopa-04d-05-ichor-rig.description = Slowly extracts [#edc787]ichor[] from ichor tiles, requires large amounts [#d488ea]elixir[] to operate.

block.exoprosopa-04d-06-nucrid-crusher.name = Nucridscrap Crusher
block.exoprosopa-04d-06-nucrid-crusher.description = Extracts [#ffd5e2]nucridscrap[] from nucrid walls.

block.exoprosopa-04d-06-nucrid-scrapper.name = Nucridscrap Shredder
block.exoprosopa-04d-06-nucrid-scrapper.description = Extracts [#ffd5e2]nucridscrap[] from nucrid walls. Faster than a regular nucridscrap crusher. Requires [#d488ea]elixir[] and power to operate.

block.exoprosopa-04d-07-gravitix-drill.name = Discharge Bore
block.exoprosopa-04d-07-gravitix-drill.description = Making use of the unique properties of [#bf97d6]gravitix[], [#edc787]ichor[] is dissected by enormous localized gravitational fields. The resulting reaction is carefully contained and directed towards the ground where it turns much of what was there to less than dust.

# Liquid Blocks
block.exoprosopa-06f-01-a-sea-conduit.name = Sea Conduit
block.exoprosopa-06f-01-a-sea-conduit.description = Transfers liquids and fluids forward.

block.exoprosopa-06f-01-b-aqua-conduit.name = Aqua Conduit
block.exoprosopa-06f-01-b-aqua-conduit.description = Transfers liquids and fluids forward, much stronger than sea conduit.

block.exoprosopa-06f-02-hoverducts.name = Hoverducts
block.exoprosopa-06f-02-hoverducts.description = Transfers liquids and fluids using non-gravity ducts, much faster than regular conduits.

block.exoprosopa-06f-02-seaduct-junction.name = Seaduct Junction
block.exoprosopa-06f-02-seaduct-junction.description = Used to cross two separate liquid pipes.

block.exoprosopa-06f-03-seaduct-router.name = Seaduct Router
block.exoprosopa-06f-03-seaduct-router.description = Distributes and intakes liquids from all sides equally.

block.exoprosopa-06f-04-liquidbridge.name = Sea Bridge
block.exoprosopa-06f-04-liquidbridge.description = Transfers liquids over blocks and buildings.

block.exoprosopa-06f-04-m-clevoritebridge.name = Reinforced Sea Bridge
block.exoprosopa-06f-04-m-clevoritebridge.description = Transfers liquids over blocks and buildings, has more range than a sea bridge.

block.exoprosopa-06f-05-a-morph-liquidbridge.name = Sea Morph Bridge
block.exoprosopa-06f-05-a-morph-liquidbridge.description = Transfers liquids over blocks and buildings at a high speed.

block.exoprosopa-06f-05-jet-pump.name = Jet Pump
block.exoprosopa-06f-05-jet-pump.description = Pumps and outputs liquids. Requires [#76c9e5]cryogenics[] to function.

block.exoprosopa-06f-05-pump.name = Hydrolic Pump
block.exoprosopa-06f-05-pump.description = Pumps and outputs liquids in large amount. Requires power to function.

block.exoprosopa-06f-06-aqua-container.name = Aqua Container
block.exoprosopa-06f-06-aqua-container.description = Stores a sizeable amount of fluids.

block.exoprosopa-06f-07-large-aqua-container.name = Large Aqua Container
block.exoprosopa-06f-07-large-aqua-container.description = Stores a large amount of fluids.

block.exoprosopa-06f-07-massive-container.name = Reinforced Aqua Container
block.exoprosopa-06f-07-massive-containerr.description = Stores a massive amount of fluids.

block.exoprosopa-06f-08-mfu.name = Miasma Filtration Unit
block.exoprosopa-06f-08-mfu.description = Filtralize [#b979bd]miasma[] into [#d488ea]elixir[] using [#90bdd8]tantrium[]. [red]Beware! Leaking conduits can be the cause for a miasma infection![]

block.exoprosopa-06f-09-nullifier.name = Nullifier
block.exoprosopa-06f-09-nullifier.description = Mixes [#edc787]ichor[] with [#ffffff]ectoplasm[] to synthesize [#b979bd]miasma[].

# Logic
block.exoprosopa-12l-001-message-chip.name = Message Chip
block.exoprosopa-12l-001-message-chip.description = Stores messages for allies to read.

block.exoprosopa-12l-002-switch.name = Switch Chip
block.exoprosopa-12l-002-switch.description = Switches between 1 and 0 when pressed.

block.exoprosopa-12l-003-terminator.name = Terminator
block.exoprosopa-12l-003-terminator.description = Runs logic instructions. Able to control units and buildings.

block.exoprosopa-12l-004-1-executor.name = Hyper Terminator
block.exoprosopa-12l-004-1-executor.description = Runs logic instructions. Able to control units and buildings. Faster than the terminal chip.

block.exoprosopa-12l-004-cell-data.name = Data Cell Chip
block.exoprosopa-12l-004-cell-data.description = Stores numbers for a terminal chip to read at a later point in time.

block.exoprosopa-12l-005-cell-data-large.name = Large Data Cell Chip
block.exoprosopa-12l-005-cell-data-large.description = Stores large numbers for a terminal chip to read at a later point in time.

block.exoprosopa-12l-005-mini-projector.name = Mini Projector Chip
block.exoprosopa-12l-005-mini-projector.description = Outputs logic data visually.

block.exoprosopa-12l-005-projector.name = Projector Chip
block.exoprosopa-12l-005-projector.description = Outputs logic data visually.

block.exoprosopa-10i-001-canvas.name = Drawer
block.exoprosopa-10i-001-canvas.description = Displays a simple image with a pre-defined palette. Editable.

block.exoprosopa-10i-002-canvas-large.name = Large Drawer
block.exoprosopa-10i-002-canvas-large.description = Displays a large size of single image with a pre-defined pallete. Images can be imported and exported. Editable.

block.exoprosopa-10i-003-canvas-massive.name = Multi Drawer
block.exoprosopa-10i-003-canvas-massive.description = Displays a massive size of single image with a pre-defined pallete. Images can be imported and exported. Editable.

# Power Blocks
block.exoprosopa-07g-01-powerline.name = Powerline
block.exoprosopa-07g-01-powerline.description = Transmits power to other blocks orthogonally.

block.exoprosopa-07g-01-q-powerbeam.name = Powerbeam
block.exoprosopa-07g-01-q-powerbeam.description = Transmits power to other blocks orthogonally, has more range than normal powerline.

block.exoprosopa-07g-02-large-powerline.name = Large Powerline
block.exoprosopa-07g-02-large-powerline.description = Transmits power to other blocks over a long distance, only capable of forming a single connection.

block.exoprosopa-07g-02-las-morphite-node.name = Morphite Node
block.exoprosopa-07g-02-las-morphite-node.description = Transmits power to other blocks over a medium distance, can connect to multiple blocks.

block.exoprosopa-07g-02-lb-supernode.name = Testing Node
block.exoprosopa-07g-02-lb-supernode.description = Connect non-powered blocks, useful while checking enemy bases in editor playtesting.

block.exoprosopa-07g-02-m-small-powerbank.name = Small Powerbank
block.exoprosopa-07g-02-m-small-powerbank.description = A battery capable of storing large amounts of power.

block.exoprosopa-07g-03-a-powerbank.name = Powerbank
block.exoprosopa-07g-03-a-powerbank.description = A battery capable of storing massive amounts of power.

block.exoprosopa-07g-03-b-power-director.name = Power Redirector
block.exoprosopa-07g-03-b-power-director.description = Moves battery power in a single direction only if the other side has less power stored.

block.exoprosopa-07g-03-burner-generator.name = Burner Generator
block.exoprosopa-07g-03-burner-generator.description = Burns flammable materials using [#d488ea]elixir[] to generate power.

block.exoprosopa-07g-04-burner-reactor.name = Burner Reactor
block.exoprosopa-07g-04-burner-reactor.description = Burns flammable materials to generate power, requires [#76c9e5]cryogenics[] and [#9d7f7f]chromium[] to function.

block.exoprosopa-07g-05-a-geogenerator.name = Geothermal Generator
block.exoprosopa-07g-05-a-geogenerator.description = Uses [#b979bd]miasma[] and [#76c9e5]cryogenics[] to heat the ground and generate power.

block.exoprosopa-07g-05-morphite-solarpanel.name = Exosphere Panel
block.exoprosopa-07g-05-morphite-solarpanel.description = Produces small amounts of power passively.

block.exoprosopa-07g-05-tokamak-reactor.name = Tokamak Reactor
block.exoprosopa-07g-05-tokamak-reactor.description = Generates large amount of power via [#51c59c]morphitix plasma[] and [#edc787]ichor[]. Explodes violently if has no sufficient fluids.

block.exoprosopa-07g-10-necroplasm-reactor.name = Necroplasia Reactor
block.exoprosopa-07g-10-necroplasm-reactor.description = Uses [#60c9ad]necroplasm's[] radioactivity to generate power and [#ffffff]ectoplasm[] as a byproduct. Explode violently if [#ffffff]ectoplasm[] reaches above the threshold.

block.exoprosopa-07g-11-hybrid-reactor.name = Hybrid Reactor
block.exoprosopa-07g-11-hybrid-reactor.description = Uses various fluids to diffuse pyroxene.

# Production - Blocks
block.exoprosopa-09i-01-aluminium-furnace.name = Aluminium Furnace
block.exoprosopa-09i-01-aluminium-furnace.description = Heats [#647cc2]cobalt[] into [#729aaf]aluminium[] using anthracite as a fuel.

block.exoprosopa-09i-02-a-aluminium-refinery-forge.name = Aluminium Refinery Forge
block.exoprosopa-09i-02-a-aluminium-refinery-forge.description = Heats [#e1cf9a]nickel[] and [#647cc2]cobalt[] using anthracite in a large amount, this process allows for bulk [#729aaf]aluminium[] production.

block.exoprosopa-09i-02-elixir-converter.name = Cryogenics Purifier
block.exoprosopa-09i-02-elixir-converter.description = Purifies [#d488ea]elixir[] using [#90bdd8]tantrium[] as a filter.

block.exoprosopa-09i-02-f-elixir-autofreezer.name = Cryogenics Autofreezer
block.exoprosopa-09i-02-f-elixir-autofreezer.description = Purifies [#d488ea]elixir[] faster than elixir purifier. Additionally utilizes [#647cc2]cobalt[] for better efficiency.

block.exoprosopa-09i-03-cryo-synthetis-chamber.name = Cryogenics Synthesis Chamber
block.exoprosopa-09i-03-cryo-synthetis-chamber.description = Purifies [#d488ea]elixir[] into [#76C9E5]cryogenics[] without dematerializing it. Uses [#ffd5e2]nucridscrap[] as a main fuel, requires medium amount of power.

block.exoprosopa-09i-04-a-terra-basin.name = Terraformic Basin
block.exoprosopa-09i-04-a-terra-basin.description = Uses [#76c9e5]cryogenics[] to transform [#e1cf9a]nickel[], exposing high charge [#afe986]clevorite[]. Outputs [#647cc2]cobalt[] and [#d488ea]elixir[] as a byproduct.

block.exoprosopa-09i-04-b-mini-basin.name = Terrafilter
block.exoprosopa-09i-04-b-mini-basin.description = Uses [#76c9e5]cryogenics[] and [#b979bd]miasma[] to transform [#e1cf9a]nickel[] into [#afe986]clevorite[], has a high conversion rate and does not produce any side-products.

block.exoprosopa-09i-04-clevorite-disassembler.name = Nichrome Disassembler
block.exoprosopa-09i-04-clevorite-disassembler.description = Crafts [#afe986]clevorite[] with [#a88b65]nichrome[] and [#76c9e5]cryogenics[]. Produces [#729aaf]aluminium[] and [#9d7f7f]chromium[] as a byproduct.

block.exoprosopa-09i-04-heavy-ichor-mixer.name = Ichor Infuser
block.exoprosopa-09i-04-heavy-ichor-mixer.description = Infuse [#76C9E5]cryogenics[] with [#90BDD8]tantrium[] to produce [#edc787]ichor[].

block.exoprosopa-09i-04-ichor-regulator.name = Heavy Ichor Infuser
block.exoprosopa-09i-04-ichor-regulator.description = Infuse [#76C9E5]cryogenics[] with [#FFD5E2]nucridscrap[] to produce large amount of [#edc787]ichor[]. Requires heat to operate.

block.exoprosopa-09i-04-laminator.name = Laminator
block.exoprosopa-09i-04-laminator.description = Produces lamine by fusing anthracite and [#e1cf9a]nickel[] with [#b979bd]miasma[] acting as a mediator.

block.exoprosopa-09i-04-lamine-chamber.name = Blast Chamber
block.exoprosopa-09i-04-lamine-chamber.description = Converts [#afe986]clevorite[] into large amounts of lamine with the aid of [#edc787]ichor[].

block.exoprosopa-09i-04-tantraformer.name = Tantraformer
block.exoprosopa-09i-04-tantraformer.description = Grinds [#e1cf9a]nickel[] and anthracite to create [#90bdd8]tantrium[]. Requires [#d488ea]elixir[] to start the process.

block.exoprosopa-09i-04-u-aquafilter.name = Aquamarine Filter
block.exoprosopa-09i-04-u-aquafilter.description = Uses [#53a999]hydryite[] to filter [#72ccbd]aquamarine[] into [#647cc2]cobalt[] and [#a88b65]nichrome[].

block.exoprosopa-09i-04-v-elemental-separator.name = Elemental Separator
block.exoprosopa-09i-04-v-elemental-separator.description = Separates [#a88b65]nichrome[] using [#90bdd8]tantrium[] and [#53a999]hydryite[].

block.exoprosopa-09i-11-morphifier-crystallizer.name = Morphite Accelerator
block.exoprosopa-09i-11-morphifier-crystallizer.description = Accelerates [#9d7f7f]chromium[] to great speeds using [#76c9e5]cryogenics[] to create [#51c59c]morphite[]. Produces [#ffffff]ectoplasm[] as a byproduct.

block.exoprosopa-09i-11-n-morphite-liquidfier.name = Morphite Discharger
block.exoprosopa-09i-11-n-morphite-liquidfier.description = Heats [#51c59c]morphite[] with [#b979bd]miasma[] and [#edc787]ichor[] to create [#51c59c]morphitix plasma[].

block.exoprosopa-09i-11-o-anthracite-heater.name = Anthracite Heater
block.exoprosopa-09i-11-o-anthracite-heater.description = Burns anthracite to produce small amounts of heats.

block.exoprosopa-09i-11-o-miasma-heater.name = Miasma Heater
block.exoprosopa-09i-11-o-miasma-heater.description = Uses organic fuel to produce moderate amounts of heats.

block.exoprosopa-09i-11-o-radiative-heater.name = Radiative Heater
block.exoprosopa-09i-11-o-radiative-heater.description = Uses lamine and [#C63B64]nucliogen[] to produce large amounts of heats.

block.exoprosopa-09i-11-o-sunlit-heater.name = Sunlit Heater
block.exoprosopa-09i-11-o-sunlit-heater.description = Uses [#60c9ad]necroplasm[] to produce extensive amount of heats.

block.exoprosopa-09i-11-p-heat-redirector.name = Heat Connector
block.exoprosopa-09i-11-p-heat-redirector.description = Transfers heat to another block.

block.exoprosopa-09i-11-q-heat-router.name = Heat Splitter
block.exoprosopa-09i-11-q-heat-router.description = Splits heat into 3 different outputs.

block.exoprosopa-09i-12-elixir-crafter.name = Biocrafter
block.exoprosopa-09i-12-elixir-crafter.description = Breaks down [#C63B64]nucliogen[] into basic bio-elixir. Works better on [#ffd5e2]nucridscrap[] surface.

block.exoprosopa-09i-12-enchanting-basin.name = Enchanting Basin
block.exoprosopa-09i-12-enchanting-basin.description = Enchants and combines [#ffd5e2]nucridscrap[] with [#ff89af]petal fragment[] to create [#ff91b3]bloodstone[], requires [#C63B64]nucliogen[] and power.

block.exoprosopa-09i-12-gravitix-chamber-core.name = Gravitix Chamber Core
block.exoprosopa-09i-12-gravitix-chamber-core.description = Utilizes an extremely strong magnetic field to fuse multiple materials into [#bf97d6]gravitix[], requires [#edc787]ichor[] and large amount of heats to operate.

block.exoprosopa-09i-12-necrolysis-boiler.name = Necrolysis Boiler
block.exoprosopa-09i-12-necrolysis-boiler.description = Turns [#b979bd]miasma[] into [#60c9ad]necroplasm[] in extreme heats.

block.exoprosopa-09i-13-technoworks.name = Technoworks
block.exoprosopa-09i-13-technoworks.description = Further refines technoscrap into techplate by heating and cooling it repeatedly.

block.exoprosopa-09i-15-pyroforge.name = Pyroforge
block.exoprosopa-09i-15-pyroforge.description = Creates pyroxene from the strongest material, requires a large amount of [#60c9ad]necroplasm[] to convert.

block.exoprosopa-09i-20-pipeline-incinerator.name = Biotic Incinerator
block.exoprosopa-09i-20-pipeline-incinerator.description = Uses [#60c9ad]miasma[] to burn inputted items.

